<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Pan-A">
  <meta id="meta-description" name="description" content="">

  <!-- Open Graph -->
  <meta property="og:type"        content="article">
  <meta property="og:locale"      content="pt_BR">
  <meta id="og-url"               property="og:url"         content="">
  <meta property="og:site_name"   content="Pan-A">
  <meta id="og-title"             property="og:title"       content="">
  <meta id="og-description"       property="og:description" content="">
  <meta id="og-image"             property="og:image"       content="">

  <title id="page-title">Blog — Pan-A</title>
  <link id="canonical" rel="canonical" href="">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/pana.css">

  <link rel="icon" href="../img/favicon.png" type="image/png">
</head>
<body>

  <!-- ═══════════════════════════════ HEADER ══════════════════════════════ -->
  <header id="header">
    <nav class="nav-container" aria-label="Navegação principal">
      <a href="../index.html" class="logo" aria-label="Pan-A — página inicial">
        <img src="../img/logo.png" alt="Pan-A">
      </a>
      <div class="nav-links">
        <div class="nav-dropdown">
          <button class="nav-dropdown-trigger" aria-expanded="false" aria-haspopup="true">
            Influenciadores <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <ul class="nav-dropdown-menu" id="influencers-nav-menu" aria-label="Lista de influenciadores"></ul>
        </div>
        <div class="nav-dropdown">
          <button class="nav-dropdown-trigger" aria-expanded="false" aria-haspopup="true">
            Blog <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <ul class="nav-dropdown-menu" id="blog-nav-menu" data-base="" aria-label="Posts do blog"></ul>
        </div>
      </div>
      <a href="../index.html#contato" class="btn-cta" aria-label="Entre em contato">
        Entre em contato
      </a>
    </nav>
  </header>


  <!-- ════════════════════════════════ POST ═══════════════════════════════ -->
  <main class="post-page" id="post-main"></main>


  <!-- ═══════════════════════════════ FOOTER ══════════════════════════════ -->
  <footer id="footer">
    <p>&copy; <span id="year"></span> Pan-A. Todos os direitos reservados.</p>
  </footer>


  <!-- Scripts -->
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="../data.js"></script>
  <script src="../blog-posts.js"></script>
  <script src="../js/pana.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const slug = new URLSearchParams(window.location.search).get('slug');
      const post = (typeof blogPosts !== 'undefined') && blogPosts.find(p => p.slug === slug);

      if (!post) {
        document.getElementById('post-main').innerHTML = `
          <div class="post-container">
            <a href="./" class="post-back">
              <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
              Voltar para o blog
            </a>
            <p>Post não encontrado.</p>
          </div>`;
        return;
      }

      // Meta tags
      const pageTitle = `${post.title} — Blog Pan-A`;
      document.getElementById('page-title').textContent = pageTitle;
      document.getElementById('meta-description').content = post.excerpt;
      document.getElementById('og-title').content = pageTitle;
      document.getElementById('og-description').content = post.excerpt;
      const canonicalURL = `https://www.pana-content.com/blog/post.html?slug=${post.slug}`;
      document.getElementById('og-url').content = canonicalURL;
      document.getElementById('canonical').href = canonicalURL;
      if (post.coverImage) {
        document.getElementById('og-image').content = `https://www.pana-content.com/${post.coverImage}`;
      }

      function renderInline(text) {
        return text
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/_(.+?)_/g, '<em>$1</em>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
      }

      function renderBlock(block) {
        switch (block.type) {
          case 'paragraph':  return `<p>${renderInline(block.text)}</p>`;
          case 'heading':    return `<h2>${block.text}</h2>`;
          case 'subheading': return `<h3>${block.text}</h3>`;
          case 'image':      return `<img src="../${block.src}" alt="${block.alt}" onerror="this.style.display='none'">`;
          case 'list':       return `<ul>${block.items.map(i => `<li>${renderInline(i)}</li>`).join('')}</ul>`;
          case 'quote':      return `<blockquote>${block.text}</blockquote>`;
          default:           return '';
        }
      }

      const dateFormatted = new Date(post.date + 'T12:00:00').toLocaleDateString('pt-BR', {
        day: '2-digit', month: 'long', year: 'numeric'
      });

      const coverHTML = post.coverImage
        ? `<img src="../${post.coverImage}" alt="${post.title}" class="post-cover"
                onerror="this.style.display='none'">`
        : '';

      const avatarHTML = post.authorAvatar
        ? `<img src="../${post.authorAvatar}" alt="Foto de ${post.author}"
                class="post-author-avatar" onerror="this.style.display='none'">`
        : '';

      const tagsHTML = post.tags.map(t => `<span class="post-tag">${t}</span>`).join('');

      document.getElementById('post-main').innerHTML = `
        ${coverHTML}
        <div class="post-container">
          <a href="./" class="post-back">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            Voltar para o blog
          </a>
          <div class="post-tags">${tagsHTML}</div>
          <h1 class="post-title">${post.title}</h1>
          <div class="post-author">
            ${avatarHTML}
            <div class="post-author-info">
              <strong>${post.author}</strong>
              <span>${post.authorRole} — ${dateFormatted}</span>
            </div>
          </div>
          <div class="post-body">
            ${post.content.map(renderBlock).join('\n            ')}
          </div>
        </div>`;
    });
  </script>

</body>
</html>
