<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Pan-A">
  <meta name="description" content="Blog da Pan-A — Artigos sobre marketing gamer, tendências do universo geek e estratégias de conteúdo para marcas.">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:locale"      content="pt_BR">
  <meta property="og:url"         content="https://www.pana-content.com/blog/">
  <meta property="og:site_name"   content="Pan-A">
  <meta property="og:title"       content="Blog — Pan-A">
  <meta property="og:description" content="Artigos sobre marketing gamer, tendências do universo geek e estratégias de conteúdo.">

  <title>Blog — Pan-A</title>
  <link rel="canonical" href="https://www.pana-content.com/blog/">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/pana.css">

  <link rel="icon" href="../img/favicon.png" type="image/png">
</head>
<body>

  <!-- ═══════════════════════════════ HEADER ══════════════════════════════ -->
  <header id="header">
    <nav class="nav-container" aria-label="Navegação principal">
      <a href="../index.html" class="logo" aria-label="Pan-A — página inicial">
        <img src="../img/logo.png" alt="Pan-A">
      </a>

      <div class="nav-links">
        <div class="nav-dropdown">
          <button class="nav-dropdown-trigger" aria-expanded="false" aria-haspopup="true">
            Influenciadores <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <ul class="nav-dropdown-menu" id="influencers-nav-menu" aria-label="Lista de influenciadores"></ul>
        </div>
        <div class="nav-dropdown">
          <button class="nav-dropdown-trigger" aria-expanded="false" aria-haspopup="true">
            Blog <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <ul class="nav-dropdown-menu" id="blog-nav-menu" data-base="" aria-label="Posts do blog"></ul>
        </div>
      </div>

      <a href="../index.html#contato" class="btn-cta" aria-label="Entre em contato">
        Entre em contato
      </a>
    </nav>
  </header>


  <!-- ════════════════════════════════ BLOG ═══════════════════════════════ -->
  <main class="blog-page">

    <div class="blog-header">
      <h1>Blog <span class="highlight">Pan-A</span></h1>
      <p>Marketing gamer, tendências geek e estratégias de conteúdo</p>
    </div>

    <div class="blog-grid-section">
      <div class="blog-grid" id="blog-grid"></div>
    </div>

  </main>


  <!-- ═══════════════════════════════ FOOTER ══════════════════════════════ -->
  <footer id="footer">
    <p>&copy; <span id="year"></span> Pan-A. Todos os direitos reservados.</p>
  </footer>


  <!-- Scripts -->
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="../data.js"></script>
  <script src="../blog-posts.js"></script>
  <script src="../js/pana.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('blog-grid');
      if (!grid) return;

      const sorted = [...blogPosts].sort((a, b) => b.date.localeCompare(a.date));

      if (sorted.length === 0) {
        grid.innerHTML = '<p class="blog-empty">Nenhum post publicado ainda.</p>';
        return;
      }

      grid.innerHTML = sorted.map(post => {
        const coverHTML = post.coverImage
          ? `<img src="../${post.coverImage}" alt="${post.title}" class="blog-card-cover"
                  onerror="this.parentElement.innerHTML='<div class=\\'blog-card-cover-placeholder\\'><i class=\\'fa-solid fa-image\\'></i></div>'">`
          : `<div class="blog-card-cover-placeholder"><i class="fa-solid fa-image" aria-hidden="true"></i></div>`;

        const dateFormatted = new Date(post.date + 'T12:00:00').toLocaleDateString('pt-BR', {
          day: '2-digit', month: 'long', year: 'numeric'
        });

        const tagsHTML = post.tags.map(t =>
          `<span class="post-tag">${t}</span>`
        ).join('');

        return `
          <article class="blog-card">
            <a href="post.html?slug=${post.slug}" aria-label="Ler: ${post.title}">
              ${coverHTML}
            </a>
            <div class="blog-card-body">
              <div class="blog-card-meta">
                <span>${dateFormatted}</span>
                <span>${post.author}</span>
              </div>
              <h2 class="blog-card-title">
                <a href="post.html?slug=${post.slug}">${post.title}</a>
              </h2>
              <p class="blog-card-excerpt">${post.excerpt}</p>
              <a href="post.html?slug=${post.slug}" class="blog-card-link">
                Ler mais <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
              </a>
            </div>
          </article>`;
      }).join('');
    });
  </script>

</body>
</html>
