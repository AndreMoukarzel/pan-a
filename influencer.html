<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Pan-A">
  <meta name="description" content="Perfil de influenciador — Pan-A">

  <title>Influenciador — Pan-A</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Styles -->
  <link rel="stylesheet" href="css/pana.css">

  <link rel="icon" href="img/favicon.png" type="image/png">
</head>
<body>

  <!-- ═══════════════════════════════ HEADER ══════════════════════════════ -->
  <header id="header">
    <nav class="nav-container" aria-label="Navegação principal">
      <a href="index.html" class="logo" aria-label="Pan-A — página inicial">
        <img src="img/logo.png" alt="Pan-A">
      </a>

      <div class="nav-links">
        <div class="nav-dropdown">
          <button class="nav-dropdown-trigger" aria-expanded="false" aria-haspopup="true">
            Influenciadores <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <ul class="nav-dropdown-menu" id="influencers-nav-menu" aria-label="Lista de influenciadores"></ul>
        </div>
        <div class="nav-dropdown">
          <button class="nav-dropdown-trigger" aria-expanded="false" aria-haspopup="true">
            Blog <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <ul class="nav-dropdown-menu" id="blog-nav-menu" data-base="blog/" aria-label="Posts do blog"></ul>
        </div>
      </div>

      <a href="index.html#contato" class="btn-cta" aria-label="Entre em contato">
        Entre em contato
      </a>
    </nav>
  </header>


  <!-- ══════════════════════════ INFLUENCER PROFILE ═══════════════════════ -->
  <main class="profile-page" id="profile-page">
    <div class="profile-content">

      <!-- ── Top: image left, info right ─────────────────────────────── -->
      <div class="profile-top">
        <div class="profile-image-col">
          <img id="profile-full-image" alt="">
        </div>
        <div class="profile-info-col">
          <h1 class="profile-name" id="profile-name"></h1>
          <p class="profile-bio" id="profile-bio"></p>
          <ul class="network-list profile-networks" id="profile-networks"></ul>
        </div>
      </div>

      <!-- ── Media Kit embed ──────────────────────────────────────────── -->
      <div class="mediakit-embed" id="mediakit-embed" hidden>
        <h2 class="mediakit-title">Media Kit</h2>
        <iframe id="mediakit-iframe" class="mediakit-iframe"
                src="" allow="autoplay" title="Media Kit"></iframe>
      </div>

      <!-- ── Actions (below embed) ────────────────────────────────────── -->
      <div class="profile-actions">
        <a id="profile-mediakit-link" href="#" target="_blank" rel="noopener noreferrer"
           class="btn-mediakit" hidden>
          <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
          Abrir em nova aba
        </a>
        <a href="index.html#influenciadores" class="btn-back">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          Voltar para influenciadores
        </a>
      </div>

    </div>
  </main>


  <!-- ═══════════════════════════════ FOOTER ══════════════════════════════ -->
  <footer id="footer">
    <p>&copy; <span id="year"></span> Pan-A. Todos os direitos reservados.</p>
  </footer>


  <!-- Scripts -->
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="data.js"></script>
  <script src="blog-posts.js"></script>
  <script src="js/pana.js"></script>
  <script src="js/influencer.js"></script>

</body>
</html>
